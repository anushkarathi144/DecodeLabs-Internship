<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="../style/style4.css">
    <script src="../script.js"></script>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="../images/logo.jpeg" alt="Sweet Scoop Logo" class="header-logo">
            <span class="logo-text">Sweet Scoop</span>
        </div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="flavors.html">Flavors</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <section class="contact-section">
        <h2>Contact here!</h2>
        <p>Have questions or feedback? We'd love to hear from you!</p>
        <form>
            <ul>
                <li>Phone: (123) 456-7890</li>
                <li>Email: info@sweetscoop.com</li>
                <li>Address: 123 Ice Cream Lane, Dessert City, USA</li>
        </ul>   
                <div class="form-group">
                    <label for="name" class="input-label">NAME</label>
                    <input id="name" placeholder="Enter your name here" name="name" required/>
                </div>
                
                <div class="form-group">
                    <label for="email" class="input-label">EMAIL</label>
                    <input type="email" id="email" placeholder="Enter your email here" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message" class="input-label">MESSAGE</label>
                    <textarea id="message" name="message" rows="5" placeholder="Enter your message here" required></textarea>
                </div>
                
                <button type="submit">Send Message</button>
        </form>
    </section>
    <footer class="footer">
        <p>&copy; 2024 Sweet Scoop. All rights reserved.</p>
    </footer>
</body>
</html>
